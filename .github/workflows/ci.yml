name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carmediahub_ci
          POSTGRES_USER: carmediahub_ci
          POSTGRES_PASSWORD: carmediahub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carmediahub_ci -d carmediahub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: carmediahub_ci
          MYSQL_USER: carmediahub_ci
          MYSQL_PASSWORD: carmediahub_ci_password
          MYSQL_ROOT_PASSWORD: carmediahub_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u carmediahub_ci -pcarmediahub_ci_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CarMediaHub/carmediahub-sdk
          path: carmediahub-sdk
      - uses: actions/checkout@v4
        with:
          repository: CarMediaHub/carmediahub-plugins
          path: carmediahub-plugins
      - name: Place SDK beside Core checkout
        run: mv carmediahub-sdk ../carmediahub-sdk
      - name: Place Plugins beside Core checkout
        run: mv carmediahub-plugins ../carmediahub-plugins
      - name: Declare pnpm build policy for both checkouts
        working-directory: ..
        run: |
          printf 'onlyBuiltDependencies:\n  - esbuild\n' > carmediahub-sdk/pnpm-workspace.yaml
          printf 'onlyBuiltDependencies:\n  - esbuild\n' > carmediahub/pnpm-workspace.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --dir ../carmediahub-sdk install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir ../carmediahub-sdk check
      - run: pnpm --dir ../carmediahub-sdk build
      - run: pnpm --dir ../carmediahub-plugins install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir ../carmediahub-plugins check
      - run: pnpm --dir ../carmediahub-plugins build
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:deployment
      - run: pnpm test:deployment
      - run: pnpm check
      - run: pnpm --dir admin install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir admin check
      - run: pnpm build:admin
      - run: pnpm test
      - run: pnpm build
      - name: Run explicit Core startup smoke
        run: pnpm smoke:startup
      - run: pnpm test:upgrade
      - run: pnpm test:component-release
      - name: Exercise the explicit PostgreSQL adapter fixture
        run: pnpm test:postgres -- --connection-string "postgresql://carmediahub_ci:carmediahub_ci_password@127.0.0.1:5432/carmediahub_ci"
      - name: Exercise the explicit MySQL adapter fixture
        run: pnpm test:mysql:service -- --host 127.0.0.1 --port 3306 --user carmediahub_ci --password carmediahub_ci_password --database carmediahub_ci
      - name: Generate CycloneDX SBOM
        run: pnpm run sbom -- "$RUNNER_TEMP/carmediahub-core.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: carmediahub-core-sbom
          path: ${{ runner.temp }}/carmediahub-core.cdx.json
      - name: Create and validate the real Native bundle
        run: |
          pnpm deploy --filter . --prod --legacy --config.node-linker=hoisted "$RUNNER_TEMP/carmediahub-runtime"
          pnpm create:native-bundle -- \
            --runtime-node-modules "$RUNNER_TEMP/carmediahub-runtime/node_modules" \
            "$RUNNER_TEMP/carmediahub-native"
          pnpm check:native-bundle -- "$RUNNER_TEMP/carmediahub-native"
          pnpm check:resources -- \
            --bundle-root "$RUNNER_TEMP/carmediahub-native" \
            --config "$RUNNER_TEMP/carmediahub-native/config/core.example.json" \
            --data-dir "$RUNNER_TEMP/carmediahub-data" \
            --required-free-bytes 1
          pnpm native-install-plan -- \
            --platform linux \
            --bundle-root "$RUNNER_TEMP/carmediahub-native" \
            --config "$RUNNER_TEMP/carmediahub-native/config/core.example.json" \
            --data-dir "$RUNNER_TEMP/carmediahub-data" \
            --node /usr/bin/node \
            --service-name carmediahub-core \
            --description "CarMediaHub Core" \
            --required-free-bytes 1
      - run: pnpm test:native-bundle
      - run: pnpm test:create-native-bundle
      - run: pnpm test:resources
      - run: pnpm check:native-bundle
      - run: pnpm test:native-service
      - run: pnpm test:native-linux-service
      - run: pnpm test:native-install-actions
      - run: pnpm test:native-install-plan
      - name: Build the Docker image from the sibling SDK checkout
        working-directory: ..
        run: docker build --tag carmediahub/core:ci --file carmediahub/Dockerfile .
      - name: Start a hardened Core container
        working-directory: ..
        shell: bash
        run: |
          set -euo pipefail
          volume_name="carmediahub-core-ci-data"
          cleanup() {
            status=$?
            docker logs carmediahub-core-ci 2>&1 || true
            docker inspect carmediahub-core-ci \
              --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' \
              2>&1 || true
            docker rm --force carmediahub-core-ci 2>&1 || true
            docker volume rm "$volume_name" 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run --detach --name carmediahub-core-ci \
            --publish 127.0.0.1:8787:8787 \
            --volume "$volume_name:/var/lib/carmediahub" \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            carmediahub/core:ci
          trap 'docker logs carmediahub-core-ci || true; docker stop carmediahub-core-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health/live >/dev/null; then
              bootstrap_status=$(curl --silent --show-error --request POST \
                --header 'content-type: application/json' \
                --data '{"username":"ci-admin","password":"correct horse battery staple","locale":"en"}' \
                --output /dev/null --write-out '%{http_code}' \
                http://127.0.0.1:8787/api/bootstrap)
              case "$bootstrap_status" in
                201|409) ;;
                *) echo "Unexpected bootstrap status: $bootstrap_status" >&2; exit 1 ;;
              esac
              curl --fail --silent http://127.0.0.1:8787/health/ready >/dev/null
              docker exec carmediahub-core-ci node dist/backup-cli.js backup \
                --data-dir /var/lib/carmediahub --output /tmp/cmh-snapshot
              docker exec carmediahub-core-ci node dist/backup-cli.js restore \
                --snapshot /tmp/cmh-snapshot --data-dir /tmp/cmh-restored
              docker exec carmediahub-core-ci node -e \
                "const fs=require('node:fs'); for (const file of ['carmediahub.sqlite','secrets/session-hmac.key']) { if (!fs.statSync('/tmp/cmh-restored/'+file).isFile()) process.exit(1); }"
              exit 0
            fi
            sleep 2
          done
          echo "Core container did not become ready" >&2
          exit 1
