services:
  core:
    build:
      context: ..
      dockerfile: carmediahub/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - carmediahub-data:/var/lib/carmediahub
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/live').then((response) => { if (!response.ok) process.exit(1); })"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  carmediahub-data:
