services:
  core:
    build:
      context: ..
      dockerfile: carmediahub/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - carmediahub-data:/var/lib/carmediahub
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  carmediahub-data:
